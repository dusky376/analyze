# 题材轴映射表 v1（人工标注，非数据）
#
# 生成依据：2026-10-14 ~ 2026-11-16 共 23 个交易日、4,363 个标签槽位、
# 1,831 个唯一标签的真实频次（data/tmp/real_tag_freq.json）。
# **本表 match 里每一个标签都在真实数据中出现过**，没有一个是凭空编的。
#
# 为什么需要这张表：
#   reason_type 的标签是"长尾"，23 天出现 1831 个唯一标签，平均每天约 79 个新标签。
#   直接按标签聚合，矩阵会碎成 200 行，"梯队断层"全是误报。
#   参考图 3 只有 5 行，说明它做过人工聚合。
#
# 三类标签的处置（实测占比，见 docs/题材数据源与实时刷新架构-2026-11-16.md §1.6）：
#   T 题材/概念 36.5% → 进本表
#   F 业绩/事件 14.7% → 不进本表（三季报增长 161 次！进表会把矩阵变成业绩榜）
#   A 属性       7.6% → 不进本表（央企/XX国资/次新股）
#   ? 未分类    41.2% → 未命中时用自身名单独成行，人工复核后回写本表
#
# 维护约定：
#   - 改任何一项都要 version +1，并在 changelog 记「谁/何时/为什么」；
#   - match 必须是理由真实出现过的标签原文（含全角引号），不写正则；
#   - 中文名是 UI 展示名，要求 ≤8 字（格子窄）。

