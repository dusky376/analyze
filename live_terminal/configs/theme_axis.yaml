version: 4
generated_from: 2026-10-08~2026-11-25 真实题材标签全量诊断 + 语义词根/共现自学习配套轴
changelog:
- v1: 初始版本，7 条主轴，match 全部取自真实高频标签
- v2: 2026-11-18 补 9 个当日真实标签（华为昇腾/AI算力/液冷算力/边缘AI算力/半导体附属装备/电子化学品/钠电池正极材料/联碱/AI算力调度）。起因：悟空真经题材分组粒度太碎，「题材内一字板+换手二板」凑不齐，当天 7 只二板（4 换手 + 2 一字）全部不产生委托。用户实测抓出。
- v3: 2026-11-23 扩轴：板块 9→11，标签 165→422（+257）。起因：实测 46.7% 的涨停股有真实题材标签但轴未收录，导致悟空真经凑不齐龟兔配对而漏票。本次只补语义明确的题材标签，排除业绩(三季报/业绩预增)与属性(国资/回购/股权转让)类——后者不应参与题材分组。
- v3b: 补各板块锚标签（轴名/高频原文）25 个，标签总数 422→447。修复：v3 扩轴时漏了板块名本身（如 ai_media 未含「AI传媒」原文），导致最核心的原始标签查不到 key。
- v4: 2026-11-26 扩轴 11→13（新增大金融·互金、智能驾驶·汽车），补全流感/中成药/东数西算/量子/6G/深海/钛白粉/甲醇/油气等高频主线，并与 theme_match.py 语义词根+同票共现自学习联动，消除静态词表盲区。
